experiment_run:
  name: "concept_figure"
  seed: 21
  dim: 10
  dim_y: 10

simulator:
  name: "gaussian_noise"
  params:
    sigma_noise: 0.1

prior:
  name: "uniform"
  params:
    low: -10
    high: 10

observation:
  name: "zeros"
  params: 
    nof_observations: 1

inference:
  name: fmpe_single_round #npe_c_single_round #npe_a_single_round   #'sbi_mcabc' #elfi_rejection_sampling #npe_a_single_round
  params:
    budget: 100000
    nof_samples: 100
    fit_kwargs:
      max_num_epochs: 300
      #nof_components: 10
    sample_kwargs: {}

analysis:
  pairwise_plot: True

evaluation:
  ground_truth: 
    name: gaussian
    params:
      mu: 0
      sigma: 0.1

  metrics:
    - name: "c2st"