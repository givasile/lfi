[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lfi"
version = "0.0.1"
description = "Likelihood-free inference methods and simulators"
authors = [
  { name = "Theodora Chrysoula" },
  { name = "Vasilis Gkolemis"},
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "seaborn",
  "loguru",
  "tqdm",
  "typer",
  "python-dotenv",
  "jax",
  "optax",
  "scikit-learn",
]

[project.optional-dependencies]
# CPU-only torch (pre-install torch first):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install lfi[torch-cpu]
torch-cpu = [
  "torch",
  "torchvision",
  "sbi",
]
# GPU torch:
#   pip install lfi[torch-gpu]
torch-gpu = [
  "torch",
  "torchvision",
  "sbi",
]
# ELFI-based inference:
#   pip install lfi[elfi]
elfi = [
  "elfi",
]
# Full install with CPU torch:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install lfi[full-cpu]
full-cpu = [
  "torch",
  "torchvision",
  "sbi",
  "elfi",
]
# Full install with GPU torch:
#   pip install lfi[full-gpu]
full-gpu = [
  "torch",
  "torchvision",
  "sbi",
  "elfi",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff]
line-length = 99
exclude = [".git", ".venv", "notebooks", "references", "models", "data"]

[tool.ruff.lint]
ignore = ["E731", "E266", "E501", "C901"]

[tool.ruff.lint.isort]
known_first_party = ["lfi"]
force_sort_within_sections = true
