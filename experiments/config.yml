experiment_run:
  seed: 21
  dim: 2
  dim_y: 2

simulator:
  name: "gaussian_noise"
  params:
    sigma_noise: 0.1

prior:
  name: "uniform"
  params:
    low: -10.0
    high: 10.0

observation:
  name: "zeros"
  params:
    nof_observations: 1

inference:
  name: npe_a_single_round
  params:
    budget: 2000
    nof_samples: 100
    fit_kwargs:
      max_num_epochs: 300
      nof_components: 4
    sample_kwargs: {}

analysis:
  pairwise_plot: True

evaluation:
  ground_truth:
    name: gaussian
    params:
      mu: 0.
      sigma: 1.0

  metrics:
    - name: "c2st"
